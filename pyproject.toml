[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-airaola"
version = "0.1.6"
description = "A statistics-driven autonomous Fantasy Premier League manager"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "requests",
    "PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "airaola",
    "airaola.data",
]